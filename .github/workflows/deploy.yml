
# reference
# - https://knowledge.sakura.ad.jp/38030/#GitHub_Actions （基本構文）
# - https://zenn.dev/mamezou/articles/23a221c7287cf6 （Build部分の記述）
# - https://qiita.com/M_Kagawa/items/98f154477b8b5bd3d315 （トラブルシューティング）

name: Deploy website on push or pull_request

on:
  push:
    branches: [ "main" ]

jobs:
  web-deploy:
    runs-on: ubuntu-latest
    steps:
    # # 変数確認用。確認したら以下2行はコメントアウトする
    # - name: test secrets
    #   run: echo secret "${{secrets.SERVER_DEPLOY_TESTDIR}}" | sed 's/./& /g'

    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Build Project
      run: |
        npm install --include=optional sharp
        npm run build
        mv ./dist ./summer2026

    - name: Deploy builded files to test server
      uses: appleboy/scp-action@master
      with:
        host: ${{secrets.SERVER_HOST}}
        username: ${{secrets.SERVER_USERNAME}}
        password: ${{secrets.SERVER_PASSWORD}} # パスワード認証は現時点ではしていないのでコメントアウト。もし公開鍵認証で不具合が起きたら復活させる
        # key: ${{secrets.SERVER_PRIVATE_KEY}}

        # デプロイ先ディレクトリの指定
        # 上が本番環境、下がテスト環境。コメントアウトで切り替える。
        source: ./summer2026/* # ビルドしたファイルをすべて転送
        target: ${{secrets.SERVER_DEPLOY_TESTDIR}}

    # テスト時は以下をコメントアウト
    - name: Deploy builded files to production server
      uses: appleboy/scp-action@master
      with:
        host: ${{secrets.SERVER_HOST}}
        username: ${{secrets.SERVER_USERNAME}}
        password: ${{secrets.SERVER_PASSWORD}} # パスワード認証は現時点ではしていないのでコメントアウト。もし公開鍵認証で不具合が起きたら復活させる
        # key: ${{secrets.SERVER_PRIVATE_KEY}}

        # デプロイ先ディレクトリの指定
        # 上が本番環境、下がテスト環境。コメントアウトで切り替える。
        source: ./summer2026/* # ビルドしたファイルをすべて転送
        target: ${{secrets.SERVER_DEPLOY_DIR}}
